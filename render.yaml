services:
  - type: web
    name: scentpool-express-sync
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    healthCheckPath: /api/health
    envVars:
      - key: SCENTPOOL_ENV
        value: production
      - key: SCENTPOOL_DB_PATH
        value: /var/data/scentpool.db
      - key: SCENTPOOL_PRODUCT_FILE
        value: /var/data/products.xlsx
      - key: SCENTPOOL_SESSION_SECURE
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "131072"
      - key: SCENTPOOL_MAX_REQUEST_THREADS
        value: "8"
      - key: SCENTPOOL_SHIPPING_TRANSIENT_RETRIES
        value: "2"
      - key: SCENTPOOL_MAX_BATCH_PRINT_ORDERS
        value: "200"
      - key: SCENTPOOL_LABEL_PROCESS_MEMORY_MB
        value: "320"
      - key: SCENTPOOL_ADMIN_PASSWORD
        sync: false
      - key: SCENTPOOL_ALLOW_DB_RESTORE
        value: "0"
      - key: SCENTPOOL_TRACKING_PROVIDER
        value: kuaidi100
      - key: SCENTPOOL_TRACKING_AUTO
        value: "1"
      - key: SCENTPOOL_TRACKING_INTERVAL_MINUTES
        value: "360"
      - key: SCENTPOOL_RETURN_TRACKING_INTERVAL_MINUTES
        value: "720"
      - key: SCENTPOOL_KUAIDI100_ENDPOINT
        value: https://poll.kuaidi100.com/poll/query.do
      - key: SCENTPOOL_KUAIDI100_CUSTOMER
        sync: false
      - key: SCENTPOOL_KUAIDI100_KEY
        sync: false
      - key: SCENTPOOL_KUAIDI100_LABEL_ENABLED
        value: "1"
      - key: SCENTPOOL_KUAIDI100_LABEL_ENDPOINT
        value: https://api.kuaidi100.com/label/order
      - key: SCENTPOOL_KUAIDI100_AUTH_ENDPOINT
        value: https://poll.kuaidi100.com/printapi/authThird.do
      - key: SCENTPOOL_KUAIDI100_THIRD_INFO_ENDPOINT
        value: https://poll.kuaidi100.com/eorderapi.do
      - key: SCENTPOOL_KUAIDI100_LABEL_SECRET
        sync: false
      - key: SCENTPOOL_PUBLIC_BASE_URL
        value: https://scentpool-express-sync-ec7c.onrender.com
    disk:
      name: scentpool-data
      mountPath: /var/data
      sizeGB: 1
