services:
  - type: web
    name: wanwu-express-sync
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    healthCheckPath: /api/health
    envVars:
      - key: WANWU_ENV
        value: production
      - key: WANWU_DB_PATH
        value: /var/data/wanwu.db
      - key: WANWU_PRODUCT_FILE
        value: /var/data/products.xlsx
      - key: WANWU_SESSION_SECURE
        value: "1"
      - key: WANWU_ADMIN_PASSWORD
        sync: false
      - key: WANWU_ALLOW_DB_RESTORE
        value: "0"
    disk:
      name: wanwu-data
      mountPath: /var/data
      sizeGB: 1
