services:
  - type: web
    name: scentpool-express-sync
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    healthCheckPath: /api/health
    envVars:
      - key: SCENTPOOL_ENV
        value: production
      - key: SCENTPOOL_DB_PATH
        value: /var/data/scentpool.db
      - key: SCENTPOOL_PRODUCT_FILE
        value: /var/data/products.xlsx
      - key: SCENTPOOL_SESSION_SECURE
        value: "1"
      - key: SCENTPOOL_ADMIN_PASSWORD
        sync: false
      - key: SCENTPOOL_ALLOW_DB_RESTORE
        value: "0"
      - key: SCENTPOOL_TRACKING_PROVIDER
        value: kdniao
      - key: SCENTPOOL_TRACKING_AUTO
        value: "1"
      - key: SCENTPOOL_TRACKING_INTERVAL_MINUTES
        value: "360"
      - key: SCENTPOOL_KDNIAO_EBUSINESS_ID
        sync: false
      - key: SCENTPOOL_KDNIAO_APP_KEY
        sync: false
    disk:
      name: scentpool-data
      mountPath: /var/data
      sizeGB: 1
